<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое расписание</title>
    <!-- Подключение библиотеки Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Использование нативных цветов темы Telegram */
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: sans-serif;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: var(--tg-theme-text-color);
        }
        .task-card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>Мои задания</h1>
    <p id="userGreeting">Загрузка...</p>

    <div class="task-card">
        <h3>Стратегическое планирование</h3>
        <p>Написать эссе: "Зачем компании стратегическое управление..."</p>
        <small>Дедлайн: 15 октября</small>
    </div>

    <button onclick="tg.close()">Закрыть приложение</button>

    <script>
        // Инициализация объекта Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Разворачиваем приложение на всю высоту экрана
        tg.expand();

        // Проверяем, доступны ли данные пользователя
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('userGreeting').innerText = `Привет, ${user.first_name}!`;
        } else {
            document.getElementById('userGreeting').innerText = 'Вы зашли не через Telegram.';
        }
    </script>
</body>
</html>
