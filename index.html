<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Расписание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Цвета меняются здесь */
:root{--accent:#785a46;--bg:#e2c499;--surface:#ffffff;--soft:#f6efe2;--ink:#000000;--muted:#6b5a3e}
*{box-sizing:border-box}
body{margin:0;padding:14px 14px 96px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:17px}
.bar{display:flex;gap:8px;margin-bottom:12px}
.tab,.btn,.chip{border:0;border-radius:11px;padding:11px 14px;font-size:16px;background:var(--surface);color:var(--ink)}
.tab{flex:1}
.on{background:var(--accent);color:#fff}
.btn{background:var(--accent);color:#fff;width:100%;margin-top:9px}
.btn.red{background:#e53935;color:#fff}
.nav{display:flex;justify-content:space-between;align-items:center;margin:8px 0 11px;font-weight:700;font-size:17px}
.nav button{border:0;background:none;font-size:26px;color:var(--accent);padding:0 8px}
h3{margin:0 0 7px;font-size:16px;color:var(--muted)}
small,.hint{color:var(--muted);font-size:14px}
.day-block{background:var(--surface);border-radius:13px;padding:11px 12px;margin-bottom:10px}
.day-block.click{cursor:pointer}
.card{background:var(--surface);border-radius:11px;padding:12px 13px;margin-bottom:9px}
.day-block .card{background:var(--soft)}
.card p{margin:6px 0;white-space:pre-wrap;font-size:15.5px;line-height:1.35}
.mini{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:15.5px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.edit{margin-left:auto;font-size:18px;padding:2px 6px;cursor:pointer}
.difficulty{display:inline-flex;align-items:center;justify-content:center;padding:4px 9px;border-radius:999px;font-size:13px;font-weight:700;color:#fff}
.difficulty.easy{background:#27C93F}
.difficulty.medium{background:#ffbd2e;color:#3a2a00}
.difficulty.hard{background:#ff605c}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cell{padding:8px 0 6px;border-radius:9px;font-size:15px;background:var(--surface);min-height:52px}
.cell.sel{background:var(--accent);color:#fff}
.dots{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin-top:4px;min-height:7px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.dot.sm{width:7px;height:7px}
.dot.base{background:#baaf96}
.dot.easy{background:#27C93F}
.dot.medium{background:#ffbd2e}
.dot.hard{background:#ff605c}
.cell.sel .dot{box-shadow:0 0 0 1.5px #fff}
.cell.today{font-weight:800;text-decoration:underline}
.weekday{padding:5px 0;font-size:13px;color:var(--muted)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:flex-end;z-index:9}
#box{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
input,textarea,select{width:100%;padding:11px;margin:5px 0 9px;border-radius:9px;border:1px solid #b89b6a;background:#fff;color:#000;font-size:17px;font-family:inherit}
.chip{display:inline-block;margin:0 7px 7px 0;cursor:pointer}
#err{color:#c62828;margin:7px 0;line-height:1.35}
#searchBar{display:none}
#searchBar input,#libSearch input{margin:0 0 12px}
#libSearch{display:none}
.area{position:relative}
.area textarea{padding-right:50px}
.clip{position:absolute;top:8px;right:8px;border:0;border-radius:8px;background:var(--soft);font-size:20px;line-height:1;padding:6px 8px;cursor:pointer}
.att{padding:9px 11px;background:#fff;border-radius:9px;margin:0 0 6px;font-size:15px;cursor:pointer}
.chk{display:flex;align-items:center;margin:4px 0 10px;font-size:17px}
.chk input{width:22px;height:22px;margin:0 10px 0 0;padding:0;flex:none}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);box-shadow:0 -6px 12px -6px rgba(0,0,0,.18)}
#bottom .btn{margin:0;width:auto;flex:1}
#bottom .tab{flex:1}
.item{display:flex;gap:12px;align-items:center;cursor:pointer}
.th{width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none}
.ic{width:52px;font-size:30px;text-align:center;flex:none}
.pdf{width:100%;height:66vh;border:0;border-radius:10px;background:#fff}
.ph{width:100%;border-radius:10px}
audio{width:100%;margin:6px 0}
.prog{height:8px;background:#fff;border-radius:6px;overflow:hidden;margin:8px 0}
#u_bar{height:100%;width:0;background:var(--accent);transition:width .2s}
</style>
</head>
<body>
<div class="bar">
  <button class="tab" data-v="list">Список</button>
  <button class="tab" data-v="week">Неделя</button>
  <button class="tab" data-v="month">Месяц</button>
  <button class="tab" id="bell">🔔</button>
</div>
<div id="err"></div>
<div id="sync" class="hint"></div>
<div id="searchBar"><input id="q" type="search" autocomplete="off" placeholder="🔍 Поиск: предмет, преподаватель, аудитория, дата" oninput="render()"></div>
<div id="libSearch"><input id="qLib" type="search" autocomplete="off" placeholder="🔍 Поиск в материалах: подпись, файл, автор, предмет" oninput="render()"></div>
<div id="main">Загрузка...</div>
<div id="bottom">
  <button class="btn" id="addBtn" onclick="openEdit()">+ Добавить</button>
  <button class="tab" id="libBtn" onclick="openLib()">📚 Учебники</button>
</div>
<div id="modal"><div id="box"></div></div>

<script>
// URL веб-приложения Apps Script (заканчивается на /exec)
const API = 'https://script.google.com/macros/s/AKfycbxrDr7gOQdW1QxfYblkd1xbN7oqzVrGBRZJFSEOS5rhyyw9YexJpBa-3Glg6aSKW90y/exec';

const tg = Telegram.WebApp; tg.ready(); tg.expand();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const today = () => new Date().toLocaleDateString('sv-SE', {timeZone: 'Europe/Moscow'});
const D = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const F = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addD = (s, n) => { const d = D(s); d.setDate(d.getDate() + n); return F(d); };
const fmt = s => D(s).toLocaleDateString('ru-RU', {weekday: 'short', day: 'numeric', month: 'long'});

let S = {tasks: [], rem: [1440, 60], files: []}, view = 'list', cur = today(), sel = today();

// Быстрый старт: данные сохраняются на телефоне и показываются сразу, пока сервер отвечает
const cacheKey = 'sched_v1_' + ((tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || 'u');
function saveCache() { try { localStorage.setItem(cacheKey, JSON.stringify({tasks: S.tasks, rem: S.rem, files: S.files || []})); } catch (e) {} }
function loadCache() {
  try { const j = JSON.parse(localStorage.getItem(cacheKey) || 'null'); return j && Array.isArray(j.tasks) ? j : null; } catch (e) { return null; }
}
const myName = () => (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || 'Вы';

let lastErr = '';
async function api(action, data = {}, raw = false) {
  $('#err').textContent = ''; lastErr = '';
  try {
    if (!tg.initData) throw new Error('Telegram initData не получен. Откройте приложение из Telegram.');
    const r = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({action, initData: tg.initData, ...data})
    });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    if (raw) return j;
    S = j; saveCache(); render();
    return j;
  } catch (e) {
    lastErr = e.message;
    $('#err').textContent = 'Ошибка: ' + e.message;
    if (!S.tasks.length) $('#main').textContent = '';
    return null;
  }
}

const difficultyLabel = v => v === 'easy' ? 'Легкий' : v === 'hard' ? 'Тяжелый' : v === 'medium' ? 'Средний' : '';
const isHw = t => t.hw === '1';
const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е');
const dayTasks = d => S.tasks.filter(t => t.date === d).sort((x, y) => (x.time || '').localeCompare(y.time || ''));

// Полная карточка: нажатие на неё или на ✏️ открывает редактирование
function card(t) {
  const diff = difficultyLabel(t.difficulty) ? t.difficulty : '', id = esc(t.id);
  return '<div class="card" onclick="openEdit(\'' + id + '\')">' +
    '<div class="meta"><b>' + esc(t.subject) + '</b><small>' + esc(t.time) + '</small>' +
    (isHw(t) ? '<span title="Домашнее задание">📝</span>' : '') +
    (attFiles(t.id).length ? '<span title="Прикреплённые файлы">📎' + attFiles(t.id).length + '</span>' : '') +
    (diff ? '<span class="difficulty ' + diff + '">' + difficultyLabel(diff) + '</span>' : '') +
    '<span class="edit" onclick="event.stopPropagation();openEdit(\'' + id + '\')">✏️</span></div>' +
    (t.description ? '<p>' + esc(t.description) + '</p>' : '') +
    '<small>— ' + esc(t.author || 'Пользователь') + '</small></div>';
}

const day = d => { const l = dayTasks(d); return l.length ? l.map(card).join('') : '<small>Пусто</small>'; };
const dayBlock = d => '<section class="day-block"><h3>' + esc(fmt(d)) + '</h3>' + day(d) + '</section>';

// Неделя: краткий список заданий дня, по нажатию открывается окно дня
function weekBlock(d) {
  const l = dayTasks(d);
  return '<section class="day-block click" onclick="openDay(\'' + d + '\')"><h3>' + esc(fmt(d)) + '</h3>' +
    (l.length ? l.map(t => '<div class="mini"><span class="dot ' + (difficultyLabel(t.difficulty) ? t.difficulty : 'base') + '"></span><b>' + esc(t.subject) + '</b><small>' + esc(t.time) + '</small>' + (isHw(t) ? '<span>📝</span>' : '') + '</div>').join('')
              : '<small>Пусто</small>') + '</section>';
}

// Поиск по всем заданиям (в том числе прошедшим): слова через пробел, все должны найтись
function searchTasks(q) {
  const words = norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return null;
  return S.tasks.filter(t => {
    const [y, m, d] = String(t.date).split('-');
    const hay = norm([t.subject, t.description, t.author, fmt(t.date), t.date, d + '.' + m + '.' + y, d + '.' + m].join(' '));
    return words.every(w => hay.includes(w));
  }).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
}

function searchHtml(res) {
  if (!res.length) return '<p class="hint">Ничего не найдено</p>';
  const shown = res.slice(0, 200);
  const dates = [...new Set(shown.map(t => t.date))];
  return '<p class="hint">Найдено: ' + res.length + (res.length > 200 ? ' (показаны первые 200)' : '') + '</p>' +
    dates.map(d => '<section class="day-block"><h3>' + esc(fmt(d)) + (d < today() ? ' · прошло' : '') + '</h3>' +
      shown.filter(t => t.date === d).map(card).join('') + '</section>').join('');
}

function openDay(d) {
  sel = d;
  modal('<h3>' + esc(fmt(d)) + '</h3>' + day(d) + '<button class="btn" onclick="openEdit()">+ Добавить на этот день</button>');
}

function render() {
  document.querySelectorAll('.tab[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('#libBtn').classList.toggle('on', view === 'lib');
  $('#addBtn').style.display = view === 'lib' ? 'none' : '';
  $('#searchBar').style.display = view === 'list' ? 'block' : 'none';
  $('#libSearch').style.display = (view === 'lib' && libTab === 'list') ? 'block' : 'none';
  let h = '';

  if (view === 'lib') {
    h = renderLib();

  } else if (view === 'list') {
    const found = searchTasks($('#q').value);
    if (found) {
      h = searchHtml(found);
    } else {
      const dates = [...new Set(S.tasks.filter(t => t.date >= today()).map(t => t.date))].sort();
      h = dates.length ? dates.map(dayBlock).join('') : '<p class="hint">Заданий пока нет</p>';
    }

  } else if (view === 'week') {
    const st = addD(cur, -((D(cur).getDay() + 6) % 7));
    h = '<div class="nav"><button onclick="shift(-1)">‹</button><span>' + esc(fmt(st)) + ' – ' + esc(fmt(addD(st, 6))) +
      '</span><button onclick="shift(1)">›</button></div>';
    for (let i = 0; i < 7; i++) h += weekBlock(addD(st, i));

  } else {
    const d = D(cur), y = d.getFullYear(), m = d.getMonth();
    const lead = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
    h = '<div class="nav"><button onclick="shift(-1)">‹</button><span>' +
      esc(d.toLocaleDateString('ru-RU', {month: 'long', year: 'numeric'})) +
      '</span><button onclick="shift(1)">›</button></div><div class="grid">';
    h += ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x => '<div class="weekday">' + x + '</div>').join('');
    h += '<div></div>'.repeat(lead);
    for (let i = 1; i <= n; i++) {
      const s = F(new Date(y, m, i));
      // по кружку на каждую пару/задание дня, по порядку расписания; цвет #baaf96, а после выбора сложности — цвет сложности
      const dots = dayTasks(s)
        .map(t => '<span class="dot sm ' + (difficultyLabel(t.difficulty) ? t.difficulty : 'base') + '"></span>').join('');
      h += '<div class="cell ' + (s === sel ? 'sel ' : '') + (s === today() ? 'today' : '') +
        '" onclick="sel=\'' + s + '\';render()">' + i + '<div class="dots">' + dots + '</div></div>';
    }
    h += '</div><div style="height:10px"></div>' + dayBlock(sel);
  }
  $('#main').innerHTML = h;
}

function shift(n) {
  const d = D(cur);
  if (view === 'week') cur = addD(cur, 7 * n); else { d.setMonth(d.getMonth() + n, 1); cur = F(d); }
  render();
}

const modal = html => { $('#box').innerHTML = html; $('#modal').style.display = 'flex'; };
const closeM = () => $('#modal').style.display = 'none';
$('#modal').onclick = e => { if (e.target.id === 'modal') closeM(); };

let FORM = {id: '', isNew: true, attached: false};
const hex8 = () => Array.from({length: 8}, () => Math.floor(Math.random() * 16).toString(16)).join('');
const attFiles = tid => (S.files || []).filter(f => f.task_id === tid);
const attHtml = () => attFiles(FORM.id).map(f => '<div class="att" onclick="tg.openLink(\'' + esc(viewUrl(f.file_id)) + '\')">' +
  (KICON[f.kind] || '📄') + ' ' + esc(f.title) + '</div>').join('');

function openEdit(id) {
  const old = id ? S.tasks.find(x => x.id === id) : null;
  const t = old || {date: sel, time: '09:00', difficulty: '', hw: '1'};
  FORM = old ? {id: old.id, isNew: false, attached: false} : {id: hex8(), isNew: true, attached: false}; // у нового задания id выдаём заранее — для вложений
  const diff = difficultyLabel(t.difficulty) ? t.difficulty : '';
  modal(
    '<h3>' + (old ? 'Редактировать' : 'Новое задание') + '</h3>' +
    '<input id="f_s" placeholder="Предмет" value="' + esc(t.subject || '') + '">' +
    '<input id="f_d" type="date" value="' + esc(t.date || today()) + '">' +
    '<input id="f_t" type="time" value="' + esc(t.time || '09:00') + '">' +
    '<select id="f_diff">' +
      '<option value=""' + (diff === '' ? ' selected' : '') + '>Сложность не выбрана</option>' +
      '<option value="easy"' + (diff === 'easy' ? ' selected' : '') + '>Легкий</option>' +
      '<option value="medium"' + (diff === 'medium' ? ' selected' : '') + '>Средний</option>' +
      '<option value="hard"' + (diff === 'hard' ? ' selected' : '') + '>Тяжелый</option>' +
    '</select>' +
    '<label class="chk"><input type="checkbox" id="f_hw"' + (isHw(t) ? ' checked' : '') + '>📝 Есть домашнее задание</label>' +
    '<div class="area"><textarea id="f_x" rows="4" placeholder="Что задано">' + esc(t.description || '') + '</textarea>' +
      '<button type="button" class="clip" title="Прикрепить файл" onclick="$(\'#att_file\').click()">📎</button></div>' +
    '<input type="file" id="att_file" style="display:none" accept=".pdf,application/pdf,image/*,audio/*" onchange="attachFile(this)">' +
    '<div id="attMsg" class="hint"></div><div id="attList">' + attHtml() + '</div>' +
    '<button class="btn" onclick="save()">Сохранить</button>' +
    (old ? '<button class="btn red" onclick="del(\'' + esc(old.id) + '\')">Удалить</button>' : '')
  );
}

// Сохранение «сразу»: результат виден мгновенно, сервер догоняет в фоне
async function save() {
  const f = FORM;
  const t = {subject: $('#f_s').value.trim(), date: $('#f_d').value, time: $('#f_t').value,
    difficulty: $('#f_diff').value, hw: $('#f_hw').checked ? '1' : '', description: $('#f_x').value.trim()};
  if (!t.subject || !t.date || !t.time) { $('#attMsg').textContent = 'Укажите предмет, дату и время.'; return; }
  const i = S.tasks.findIndex(x => x.id === f.id);
  if (i >= 0) Object.assign(S.tasks[i], t); else S.tasks.push({id: f.id, author: myName(), ...t});
  render(); closeM();
  // у нового задания id отправляем, только если к нему уже прикреплены файлы
  const res = await api('save', {task: {id: (f.isNew && !f.attached) ? '' : f.id, isNew: f.isNew, ...t}});
  if (!res) { const m = $('#err').textContent; await api('list'); $('#err').textContent = m; }
}

// 📎 в описании: файл загружается в «Учебники» и привязывается к этому заданию
async function attachFile(inp) {
  const f = inp.files && inp.files[0];
  inp.value = '';
  if (!f) return;
  const msg = $('#attMsg');
  const subj = $('#f_s').value.trim(), base = f.name.replace(/\.[^.]+$/, '');
  msg.textContent = 'Загрузка…';
  try {
    const last = await uploadOne(f, subj ? subj + ' · ' + base : base, FORM.id,
      (o, t) => { msg.textContent = 'Загрузка ' + Math.round(o / t * 100) + '%'; });
    S = last; saveCache(); render();
    FORM.attached = true;
    if ($('#attList')) { $('#attList').innerHTML = attHtml(); $('#attMsg').textContent = '✅ Файл прикреплён и добавлен в «Учебники»'; }
  } catch (e) {
    if ($('#attMsg')) $('#attMsg').textContent = 'Ошибка: ' + e.message;
  }
}

function del(id) {
  tg.showConfirm('Удалить задание?', async ok => {
    if (!ok) return;
    S.tasks = S.tasks.filter(x => x.id !== id); render(); closeM();
    const res = await api('delete', {id});
    if (!res) { const m = $('#err').textContent; await api('list'); $('#err').textContent = m; }
  });
}

// ---------- Учебники: PDF, фото, аудио ----------
let libTab = 'list', libF = 'all';
const KICON = {book: '📕', photo: '🖼', audio: '🎧'};
const MAX_FILE = 50 * 1024 * 1024, CHUNK = 786432; // кратно 256 КБ
const dlUrl = fid => 'https://drive.google.com/uc?export=download&id=' + fid;
const viewUrl = fid => 'https://drive.google.com/file/d/' + fid + '/view';
const thumb = (fid, w) => 'https://drive.google.com/thumbnail?id=' + fid + '&sz=w' + w;
const mb = n => (Number(n) / 1048576).toFixed(1) + ' МБ';
const EXT = {pdf:'application/pdf', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', webp:'image/webp', heic:'image/heic', gif:'image/gif',
  mp3:'audio/mpeg', m4a:'audio/mp4', wav:'audio/wav', ogg:'audio/ogg', oga:'audio/ogg', opus:'audio/ogg', aac:'audio/aac'};

function openLib() { view = 'lib'; libTab = 'list'; $('#qLib').value = ''; render(); }

function renderLib() {
  let h = '<div class="bar"><button class="tab ' + (libTab === 'list' ? 'on' : '') + '" onclick="libTab=\'list\';render()">📚 Материалы</button>' +
    '<button class="tab ' + (libTab === 'up' ? 'on' : '') + '" onclick="libTab=\'up\';render()">⬆️ Загрузить</button></div>';

  if (libTab === 'up') {
    return h + '<h3>Новый материал</h3>' +
      '<input id="u_file" type="file" accept=".pdf,application/pdf,image/*,audio/*">' +
      '<input id="u_title" maxlength="120" placeholder="Подпись (например: Математика, учебник 10 класс)">' +
      '<div class="prog" id="u_prog" style="display:none"><div id="u_bar"></div></div>' +
      '<div class="hint" id="u_txt"></div>' +
      '<button class="btn" id="u_btn" onclick="doUpload()">Загрузить</button>' +
      '<p class="hint">PDF, фото и аудио до 50 МБ. Не закрывайте приложение, пока идёт загрузка.</p>';
  }

  const FILT = [['all', 'Все'], ['book', '📕 Книги'], ['photo', '🖼 Фото'], ['audio', '🎧 Аудио']];
  h += '<div>' + FILT.map(([k, l]) => '<button class="chip ' + (libF === k ? 'on' : '') + '" onclick="libF=\'' + k + '\';render()">' + l + '</button>').join('') + '</div>';
  const list = libFiltered();
  const searching = $('#qLib').value.trim() !== '';
  return h + (list.length ? list.map(fileCard).join('')
    : searching ? '<p class="hint">Ничего не найдено</p>'
    : '<p class="hint">Пока ничего нет. Загрузите первый материал во вкладке «Загрузить».</p>');
}

const KWORD = {book: 'книга учебник pdf', photo: 'фото изображение', audio: 'аудио запись конспект'};

// Фильтр по виду + поиск по словам (подпись, имя файла, автор, дата, предмет задания)
function libFiltered() {
  const words = norm($('#qLib').value).split(/\s+/).filter(Boolean);
  return (S.files || []).filter(f => {
    if (libF !== 'all' && f.kind !== libF) return false;
    const tk = S.tasks.find(t => t.id === f.task_id);
    const hay = norm([f.title, f.name, f.author, f.date, KWORD[f.kind], tk ? tk.subject + ' ' + fmt(tk.date) : ''].join(' '));
    return words.every(w => hay.includes(w));
  });
}

function fileCard(f) {
  const tk = f.task_id ? S.tasks.find(t => t.id === f.task_id) : null;
  const th = f.kind === 'photo' ? '<img class="th" loading="lazy" src="' + esc(thumb(f.file_id, 200)) + '">' : '<div class="ic">' + (KICON[f.kind] || '📄') + '</div>';
  return '<div class="card item" onclick="openFile(\'' + esc(f.id) + '\')">' + th + '<div><b>' + esc(f.title) + '</b><br><small>' +
    esc(f.name) + ' · ' + mb(f.size) + '<br>— ' + esc(f.author) + ', ' + esc(f.date) +
    (tk ? '<br>📎 к заданию: ' + esc(tk.subject) + ', ' + esc(fmt(tk.date)) : '') + '</small></div></div>';
}

function openFile(id) {
  const f = (S.files || []).find(x => x.id === id);
  if (!f) return;
  const fid = f.file_id;
  let body;
  if (f.kind === 'book') body = '<iframe class="pdf" src="https://drive.google.com/file/d/' + esc(fid) + '/preview"></iframe>';
  else if (f.kind === 'photo') body = '<img class="ph" src="' + esc(thumb(fid, 1600)) + '">';
  else body = '<audio controls preload="none" src="' + esc(dlUrl(fid)) + '"></audio><p class="hint">Если запись не играет, нажмите «Открыть в браузере».</p>';
  modal('<h3>' + esc(f.title) + '</h3>' + body +
    '<button class="btn" onclick="tg.openLink(\'' + esc(dlUrl(fid)) + '\')">⬇️ Скачать</button>' +
    '<button class="btn" onclick="tg.openLink(\'' + esc(viewUrl(fid)) + '\')">🌐 Открыть в браузере</button>' +
    '<button class="btn red" onclick="delFile(\'' + esc(f.id) + '\')">Удалить</button>');
}

function delFile(id) {
  tg.showConfirm('Удалить файл?', ok => { if (ok) { api('deleteFile', {id}); closeM(); } });
}

const toB64 = blob => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(',')[1]);
  r.onerror = () => rej(r.error);
  r.readAsDataURL(blob);
});

// Загрузка одного файла по частям. Возвращает свежее состояние с сервера.
async function uploadOne(f, title, taskId, onProgress) {
  if (!f.size) throw new Error('Файл пустой.');
  if (f.size > MAX_FILE) throw new Error('Файл больше 50 МБ.');
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  const mime = f.type || EXT[ext] || '';
  const kind = mime === 'application/pdf' ? 'book' : mime.startsWith('image/') ? 'photo' : mime.startsWith('audio/') ? 'audio' : '';
  if (!kind) throw new Error('Поддерживаются только PDF, фото и аудио.');

  const st = await api('uploadStart', {name: f.name, mime, size: f.size, kind, title, task_id: taskId || ''}, true);
  if (!st) throw new Error(lastErr || 'не удалось начать загрузку');
  let off = 0, last = null;
  while (off < f.size) {
    const end = Math.min(off + CHUNK, f.size);
    const data = await toB64(f.slice(off, end));
    let r = null;
    for (let attempt = 0; attempt < 2 && !r; attempt++) {
      r = await api('uploadChunk', {uploadId: st.uploadId, offset: off, total: f.size, data}, true);
    }
    if (!r) throw new Error(lastErr || 'загрузка прервана');
    off = end;
    if (onProgress) onProgress(off, f.size);
    if (r.done) last = r;
  }
  if (!last) throw new Error('сервер не подтвердил загрузку');
  return last;
}

async function doUpload() {
  const f = $('#u_file').files[0], title = $('#u_title').value.trim();
  const err = m => { $('#err').textContent = m; };
  err('');
  if (!f) return err('Выберите файл.');
  if (!title) return err('Добавьте подпись.');
  const btn = $('#u_btn');
  btn.disabled = true; btn.textContent = 'Загрузка...';
  $('#u_prog').style.display = 'block';
  try {
    S = await uploadOne(f, title, '', (o, t) => {
      $('#u_bar').style.width = Math.round(o / t * 100) + '%';
      $('#u_txt').textContent = mb(o) + ' из ' + mb(t);
    });
    saveCache(); libTab = 'list'; render();
  } catch (e) {
    err('Ошибка: ' + e.message);
    btn.disabled = false; btn.textContent = 'Загрузить';
  }
}

// ---------- Напоминания ----------
const OPTS = [[1440, 'за 1 день'], [180, 'за 3 часа'], [60, 'за 1 час'], [30, 'за 30 минут'], [10, 'за 10 минут']];

$('#bell').onclick = () => {
  modal('<h3>Когда напоминать о заданиях</h3><div>' + OPTS.map(([m, l]) =>
    '<button class="chip ' + (S.rem.includes(m) ? 'on' : '') + '" onclick="tgl(' + m + ',this)">' + l + '</button>').join('') +
    '</div><p class="hint">Ничего не выбрано — напоминаний не будет. Время — МСК.</p>' +
    '<button class="btn" onclick="saveReminders()">Сохранить</button>');
};

async function saveReminders() {
  closeM();
  await api('setReminders', {rem: S.rem});
}

function tgl(m, el) {
  S.rem = S.rem.includes(m) ? S.rem.filter(x => x !== m) : [...S.rem, m].sort((a, b) => b - a);
  el.classList.toggle('on');
}

document.querySelectorAll('.tab[data-v]').forEach(b => b.onclick = () => { view = b.dataset.v; cur = today(); sel = today(); $('#q').value = ''; render(); });

const cached = loadCache();
if (cached) {
  S = {tasks: cached.tasks, rem: cached.rem || [1440, 60], files: cached.files || []};
  render();
  $('#sync').textContent = 'Обновляем…';
}
api('list').then(() => { $('#sync').textContent = ''; });
</script>
