<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Расписание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Цвета меняются здесь */
:root{--accent:#785a46;--bg:#e2c499;--surface:#ffffff;--soft:#f6efe2;--ink:#000000;--muted:#6b5a3e}
*{box-sizing:border-box}
body{margin:0;padding:14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:17px}
.bar{display:flex;gap:8px;margin-bottom:12px}
.tab,.btn,.chip{border:0;border-radius:11px;padding:11px 14px;font-size:16px;background:var(--surface);color:var(--ink)}
.tab{flex:1}
.on{background:var(--accent);color:#fff}
.btn{background:var(--accent);color:#fff;width:100%;margin-top:9px}
.btn.red{background:#e53935;color:#fff}
.nav{display:flex;justify-content:space-between;align-items:center;margin:8px 0 11px;font-weight:700;font-size:17px}
.nav button{border:0;background:none;font-size:26px;color:var(--accent);padding:0 8px}
h3{margin:0 0 7px;font-size:16px;color:var(--muted)}
small,.hint{color:var(--muted);font-size:14px}
.day-block{background:var(--surface);border-radius:13px;padding:11px 12px;margin-bottom:10px}
.day-block.click{cursor:pointer}
.card{background:var(--surface);border-radius:11px;padding:12px 13px;margin-bottom:9px}
.day-block .card{background:var(--soft)}
.card p{margin:6px 0;white-space:pre-wrap;font-size:15.5px;line-height:1.35}
.mini{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:15.5px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.edit{margin-left:auto;font-size:18px;padding:2px 6px;cursor:pointer}
.difficulty{display:inline-flex;align-items:center;justify-content:center;padding:4px 9px;border-radius:999px;font-size:13px;font-weight:700;color:#fff}
.difficulty.easy{background:#78a5a3}
.difficulty.medium{background:#e1b16a}
.difficulty.hard{background:#ce5a57}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cell{padding:10px 0;border-radius:9px;font-size:15px;position:relative;background:var(--surface);min-height:39px}
.cell.has::after{content:'';position:absolute;bottom:3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}
.cell.sel{background:var(--accent);color:#fff}
.cell.sel.has::after{background:#fff}
.cell.today{font-weight:800;text-decoration:underline}
.weekday{padding:5px 0;font-size:13px;color:var(--muted)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:flex-end;z-index:9}
#box{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
input,textarea,select{width:100%;padding:11px;margin:5px 0 9px;border-radius:9px;border:1px solid #b89b6a;background:#fff;color:#000;font-size:17px;font-family:inherit}
.chip{display:inline-block;margin:0 7px 7px 0;cursor:pointer}
#err{color:#c62828;margin:7px 0;line-height:1.35}
</style>
</head>
<body>
<div class="bar">
  <button class="tab" data-v="list">Список</button>
  <button class="tab" data-v="week">Неделя</button>
  <button class="tab" data-v="month">Месяц</button>
  <button class="tab" id="bell">🔔</button>
</div>
<div id="err"></div>
<div id="main">Загрузка...</div>
<button class="btn" onclick="openEdit()">+ Добавить задание</button>
<div id="modal"><div id="box"></div></div>

<script>
// URL веб-приложения Apps Script (заканчивается на /exec)
const API = 'https://script.google.com/macros/s/AKfycbxrDr7gOQdW1QxfYblkd1xbN7oqzVrGBRZJFSEOS5rhyyw9YexJpBa-3Glg6aSKW90y/exec';

const tg = Telegram.WebApp; tg.ready(); tg.expand();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const today = () => new Date().toLocaleDateString('sv-SE', {timeZone: 'Europe/Moscow'});
const D = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const F = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addD = (s, n) => { const d = D(s); d.setDate(d.getDate() + n); return F(d); };
const fmt = s => D(s).toLocaleDateString('ru-RU', {weekday: 'short', day: 'numeric', month: 'long'});

let S = {tasks: [], rem: [1440, 60]}, view = 'list', cur = today(), sel = today();

async function api(action, data = {}) {
  $('#err').textContent = '';
  try {
    if (!tg.initData) throw new Error('Telegram initData не получен. Откройте приложение из Telegram.');
    const r = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({action, initData: tg.initData, ...data})
    });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    S = j; render();
    return j;
  } catch (e) {
    $('#err').textContent = 'Ошибка: ' + e.message;
    if (!S.tasks.length) $('#main').textContent = '';
    return null;
  }
}

const difficultyLabel = v => v === 'easy' ? 'Легкий' : v === 'hard' ? 'Тяжелый' : 'Средний';
const dayTasks = d => S.tasks.filter(t => t.date === d).sort((x, y) => (x.time || '').localeCompare(y.time || ''));

// Полная карточка: нажатие на неё или на ✏️ открывает редактирование
function card(t) {
  const diff = t.difficulty || 'medium', id = esc(t.id);
  return '<div class="card" onclick="openEdit(\'' + id + '\')">' +
    '<div class="meta"><b>' + esc(t.subject) + '</b><small>' + esc(t.time) + '</small>' +
    '<span class="difficulty ' + diff + '">' + difficultyLabel(diff) + '</span>' +
    '<span class="edit" onclick="event.stopPropagation();openEdit(\'' + id + '\')">✏️</span></div>' +
    (t.description ? '<p>' + esc(t.description) + '</p>' : '') +
    '<small>— ' + esc(t.author || 'Пользователь') + '</small></div>';
}

const day = d => { const l = dayTasks(d); return l.length ? l.map(card).join('') : '<small>Пусто</small>'; };
const dayBlock = d => '<section class="day-block"><h3>' + esc(fmt(d)) + '</h3>' + day(d) + '</section>';

// Неделя: краткий список заданий дня, по нажатию открывается окно дня
function weekBlock(d) {
  const l = dayTasks(d);
  return '<section class="day-block click" onclick="openDay(\'' + d + '\')"><h3>' + esc(fmt(d)) + '</h3>' +
    (l.length ? l.map(t => '<div class="mini"><b>' + esc(t.subject) + '</b><small>' + esc(t.time) + '</small></div>').join('')
              : '<small>Пусто</small>') + '</section>';
}

function openDay(d) {
  sel = d;
  modal('<h3>' + esc(fmt(d)) + '</h3>' + day(d) + '<button class="btn" onclick="openEdit()">+ Добавить на этот день</button>');
}

function render() {
  document.querySelectorAll('.tab[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  let h = '';

  if (view === 'list') {
    const dates = [...new Set(S.tasks.filter(t => t.date >= today()).map(t => t.date))].sort();
    h = dates.length ? dates.map(dayBlock).join('') : '<p class="hint">Заданий пока нет</p>';

  } else if (view === 'week') {
    const st = addD(cur, -((D(cur).getDay() + 6) % 7));
    h = '<div class="nav"><button onclick="shift(-1)">‹</button><span>' + esc(fmt(st)) + ' – ' + esc(fmt(addD(st, 6))) +
      '</span><button onclick="shift(1)">›</button></div>';
    for (let i = 0; i < 7; i++) h += weekBlock(addD(st, i));

  } else {
    const d = D(cur), y = d.getFullYear(), m = d.getMonth();
    const lead = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
    h = '<div class="nav"><button onclick="shift(-1)">‹</button><span>' +
      esc(d.toLocaleDateString('ru-RU', {month: 'long', year: 'numeric'})) +
      '</span><button onclick="shift(1)">›</button></div><div class="grid">';
    h += ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x => '<div class="weekday">' + x + '</div>').join('');
    h += '<div></div>'.repeat(lead);
    for (let i = 1; i <= n; i++) {
      const s = F(new Date(y, m, i));
      h += '<div class="cell ' + (S.tasks.some(t => t.date === s) ? 'has ' : '') + (s === sel ? 'sel ' : '') +
        (s === today() ? 'today' : '') + '" onclick="sel=\'' + s + '\';render()">' + i + '</div>';
    }
    h += '</div><div style="height:10px"></div>' + dayBlock(sel);
  }
  $('#main').innerHTML = h;
}

function shift(n) {
  const d = D(cur);
  if (view === 'week') cur = addD(cur, 7 * n); else { d.setMonth(d.getMonth() + n, 1); cur = F(d); }
  render();
}

const modal = html => { $('#box').innerHTML = html; $('#modal').style.display = 'flex'; };
const closeM = () => $('#modal').style.display = 'none';
$('#modal').onclick = e => { if (e.target.id === 'modal') closeM(); };

function openEdit(id) {
  const t = S.tasks.find(x => x.id === id) || {date: sel, time: '09:00', difficulty: 'medium'};
  const diff = t.difficulty || 'medium';
  modal(
    '<h3>' + (id ? 'Редактировать' : 'Новое задание') + '</h3>' +
    '<input id="f_s" placeholder="Предмет" value="' + esc(t.subject || '') + '">' +
    '<input id="f_d" type="date" value="' + esc(t.date || today()) + '">' +
    '<input id="f_t" type="time" value="' + esc(t.time || '09:00') + '">' +
    '<select id="f_diff">' +
      '<option value="easy"' + (diff === 'easy' ? ' selected' : '') + '>Легкий</option>' +
      '<option value="medium"' + (diff === 'medium' ? ' selected' : '') + '>Средний</option>' +
      '<option value="hard"' + (diff === 'hard' ? ' selected' : '') + '>Тяжелый</option>' +
    '</select>' +
    '<textarea id="f_x" rows="4" placeholder="Что задано">' + esc(t.description || '') + '</textarea>' +
    '<button class="btn" onclick="save(\'' + esc(id || '') + '\')">Сохранить</button>' +
    (id ? '<button class="btn red" onclick="del(\'' + esc(id) + '\')">Удалить</button>' : '')
  );
}

async function save(id) {
  const result = await api('save', {task: {
    id, subject: $('#f_s').value.trim(), date: $('#f_d').value, time: $('#f_t').value,
    difficulty: $('#f_diff').value, description: $('#f_x').value.trim()
  }});
  if (result) closeM();
}

function del(id) {
  tg.showConfirm('Удалить задание?', ok => { if (ok) { api('delete', {id}); closeM(); } });
}

// ---------- Напоминания ----------
const OPTS = [[1440, 'за 1 день'], [180, 'за 3 часа'], [60, 'за 1 час'], [30, 'за 30 минут'], [10, 'за 10 минут']];

$('#bell').onclick = () => {
  modal('<h3>Когда напоминать о заданиях</h3><div>' + OPTS.map(([m, l]) =>
    '<button class="chip ' + (S.rem.includes(m) ? 'on' : '') + '" onclick="tgl(' + m + ',this)">' + l + '</button>').join('') +
    '</div><p class="hint">Ничего не выбрано — напоминаний не будет. Время — МСК.</p>' +
    '<button class="btn" onclick="saveReminders()">Сохранить</button>');
};

async function saveReminders() {
  const result = await api('setReminders', {rem: S.rem});
  if (result) closeM();
}

function tgl(m, el) {
  S.rem = S.rem.includes(m) ? S.rem.filter(x => x !== m) : [...S.rem, m].sort((a, b) => b - a);
  el.classList.toggle('on');
}

document.querySelectorAll('.tab[data-v]').forEach(b => b.onclick = () => { view = b.dataset.v; cur = today(); sel = today(); render(); });
api('list');
</script>
</body>
</html>
